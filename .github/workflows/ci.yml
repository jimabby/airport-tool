name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Config builder tests
        working-directory: config-gen
        run: node test.js

      # Exercises every protocol path in setup.sh against stubbed system
      # commands. It never runs the real installers or touches the runner.
      - name: setup.sh smoke tests
        run: bash server/test-setup.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning server/setup.sh server/test-setup.sh

      - name: Install web UI dependencies
        working-directory: web-ui
        run: npm install --no-audit --no-fund

      # Covers profile CRUD, import, downloads, the subscription gate and — the
      # part that has actually been wrong — that every credential-bearing route
      # demands the dashboard token once the UI is off loopback.
      - name: Web UI API tests
        working-directory: web-ui
        run: node test/api.js

      # The deep connection test against a stubbed sing-box: proves the probe
      # generates a usable config, starts the proxy, gets traffic through it and
      # reports a failure to start rather than a bare timeout.
      - name: Deep connection test
        working-directory: web-ui
        run: node test/deep-test.js

      - name: Audit runtime dependencies
        working-directory: web-ui
        run: npm audit --omit=dev --audit-level=moderate
