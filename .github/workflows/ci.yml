name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, against the *latest* sing-box and mihomo rather than the pinned
  # ones (see the real-clients step). Nothing in this repo changes between
  # these runs; the clients do, and that is exactly how the bundles broke.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24 is the current LTS. 20 went end-of-life in April 2026.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # test.js needs no dependencies, but gen.js pulls in qrcode.
      # `npm ci` rather than `npm install`: the lockfiles are committed, and a
      # CI run that quietly resolves a different tree is not testing what ships.
      - name: Install config-gen dependencies
        working-directory: config-gen
        run: npm ci --no-audit --no-fund

      - name: Config builder tests
        working-directory: config-gen
        run: node test.js

      # The CLI shares its probe and history code with the web UI, so a broken
      # extraction shows up here before it shows up as a 500 in the dashboard.
      - name: CLI smoke test
        working-directory: config-gen
        run: |
          cp servers.json.example /tmp/ci-servers.json
          node gen.js --config /tmp/ci-servers.json
          # Nothing in the example resolves, so --test exits 1 on purpose;
          # what matters is that it probes and reports rather than crashing.
          node gen.js --test --config /tmp/ci-servers.json || true
          test -f output/clash-config.yaml
          test -f output/singbox-config.json
          # Surge and Quantumult X cannot express every protocol, so these are
          # expected to be partial — but they must exist, and must say what they
          # left out rather than quietly shortening themselves.
          test -f output/surge.conf
          test -f output/quantumultx.conf
          grep -q 'skipped' output/surge.conf
          grep -q 'skipped' output/quantumultx.conf

      # --test --json is the contract a cron job or monitoring agent reads, so
      # it has to stay parseable even on the run where every server is down.
      - name: Probe output is machine-readable
        working-directory: config-gen
        run: |
          node gen.js --test --json --config /tmp/ci-servers.json > /tmp/probe.json || true
          node -e "
            const r = JSON.parse(require('fs').readFileSync('/tmp/probe.json','utf8'));
            if (!Array.isArray(r.servers) || !r.state) throw new Error('unexpected shape');
            console.log('--test --json parsed:', r.servers.length, 'servers, state', r.state);
          "

      # Exercises every protocol path in setup.sh against stubbed system
      # commands. It never runs the real installers or touches the runner.
      - name: setup.sh smoke tests
        run: bash server/test-setup.sh

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning server/setup.sh server/test-setup.sh web-ui/install-service.sh

      - name: Install web UI dependencies
        working-directory: web-ui
        run: npm ci --no-audit --no-fund

      # Covers profile CRUD, import, downloads, the subscription gate and — the
      # parts that have actually been wrong — that every credential-bearing
      # route demands the dashboard token once the UI is off loopback, and that
      # a cross-site page cannot post to any of them. Also exercises TLS, which
      # needs openssl to mint a certificate; ubuntu-latest ships it.
      - name: Web UI API tests
        working-directory: web-ui
        run: node test/api.js

      # The deep connection test against a stubbed sing-box: proves the probe
      # generates a usable config, starts the proxy, gets traffic through it and
      # reports a failure to start rather than a bare timeout.
      - name: Deep connection test
        working-directory: web-ui
        run: node test/deep-test.js

      # A config that no client can parse is the failure this whole toolchain
      # exists to avoid, so the generated files get checked against real parsers.
      - name: Generated configs are valid
        working-directory: config-gen
        run: |
          node -e "JSON.parse(require('fs').readFileSync('output/singbox-config.json','utf8'))"
          npm install --no-save --no-audit --no-fund js-yaml
          node -e "require('js-yaml').load(require('fs').readFileSync('output/clash-config.yaml','utf8'))"
          echo "clash-config.yaml and singbox-config.json both parse"
          # The Fallback group is what makes the profile order mean anything —
          # url-test picks by latency and ignores order entirely. It went missing
          # from the generated config while three places still promised it.
          node -e "
            const y = require('js-yaml').load(require('fs').readFileSync('output/clash-config.yaml','utf8'));
            const g = y['proxy-groups'].find((x) => x.name === 'Fallback');
            if (!g || g.type !== 'fallback') throw new Error('no fallback group in clash-config.yaml');
            console.log('fallback group present, in store order:', g.proxies.join(', '));
          "

      # Parsing the files proves they are YAML and JSON. It does not prove the
      # clients will load them: sing-box 1.14 refused to start every bundle
      # that named a server by hostname, and refused the DNS detour it carried,
      # while every check above passed. So the bundles go through the real
      # binaries — and the desktop sing-box bundle is actually started, because
      # some of what it rejects is only checked at start-up.
      #
      # Pinned versions on push, so a run is reproducible; the latest releases
      # on the weekly schedule, so an upstream change shows up here first.
      - name: Generated configs load in real sing-box and mihomo
        working-directory: config-gen
        env:
          SINGBOX_VERSION: '1.14.2'
          MIHOMO_VERSION: 'v1.19.31'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SINGBOX_VERSION=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name | sed 's/^v//')
            MIHOMO_VERSION=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)
          fi
          echo "sing-box ${SINGBOX_VERSION}, mihomo ${MIHOMO_VERSION}"
          mkdir -p /tmp/clients
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp/clients --strip-components=1
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz" \
            | gunzip > /tmp/clients/mihomo
          chmod +x /tmp/clients/sing-box /tmp/clients/mihomo
          SINGBOX_BIN=/tmp/clients/sing-box MIHOMO_BIN=/tmp/clients/mihomo REQUIRE_REAL_CLIENTS=1 \
            node test-real-clients.js

      # The dashboard is a single self-contained page, so a broken reference in
      # it is a runtime error nothing else here would catch: the API tests never
      # execute this file, and there is no build step to fail.
      - name: Dashboard page is self-consistent
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('web-ui/public/index.html', 'utf8');
            const m = html.match(/<script>([\s\S]*)<\/script>/);
            if (!m) throw new Error('no inline script found');
            const js = m[1];
            // Parses at all.
            new Function(js);
            const ids = new Set([...html.matchAll(/\sid=\"([^\"]+)\"/g)].map((x) => x[1]));
            const missing = [...new Set([...js.matchAll(/\\\$\('([^']+)'\)/g)].map((x) => x[1]))]
              .filter((r) => !ids.has(r));
            if (missing.length) throw new Error('\$() with no such element: ' + missing.join(', '));
            const dls = [...html.matchAll(/data-dl=\"([^\"]+)\"/g)].map((x) => x[1]);
            const keys = [...js.matchAll(/^\s+'?([a-z-]+)'?: '\/api\/download/gm)].map((x) => x[1]);
            const unmapped = dls.filter((d) => !keys.includes(d));
            if (unmapped.length) throw new Error('download button with no route: ' + unmapped.join(', '));
            const copies = [...html.matchAll(/data-copy=\"([^\"]+)\"/g)].map((x) => x[1]);
            const badCopy = copies.filter((c) => !ids.has(c));
            if (badCopy.length) throw new Error('data-copy target missing: ' + badCopy.join(', '));
            console.log('page ok:', ids.size, 'ids,', dls.length, 'download buttons');
          "

      # The image is the documented way to run this anywhere that is not a
      # systemd box, so a Dockerfile that does not build is a broken install
      # path. Build only — running it would need a store to mount.
      - name: Docker image builds
        run: docker build -t airport-tool:ci .

      # The generated files each carry every proxy password in plain text, so
      # they must not be world-readable. Checked on Linux because that is where
      # the mode means anything — Windows checkouts silently ignore it.
      - name: Generated configs are not world-readable
        working-directory: config-gen
        run: |
          bad=$(find output -type f ! -perm 600 -print)
          dir=$(stat -c '%a' output)
          if [ -n "$bad" ] || [ "$dir" != "700" ]; then
            echo "output/ is $dir, and these files are not 0600:"; echo "$bad"; exit 1
          fi
          echo "output/ is 0700 and every file in it is 0600"

      # The two behaviours that only exist at the process boundary: reading a
      # profile off stdin, and the cron half of the health monitor firing once
      # on the change and then staying quiet.
      - name: CLI behaviour tests
        working-directory: config-gen
        run: node test-cli.js

      # Both packages ship runtime dependencies, and both end up handling
      # credentials — auditing only one of them was an oversight.
      - name: Audit runtime dependencies (web UI)
        working-directory: web-ui
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit runtime dependencies (config-gen)
        working-directory: config-gen
        run: npm audit --omit=dev --audit-level=moderate
